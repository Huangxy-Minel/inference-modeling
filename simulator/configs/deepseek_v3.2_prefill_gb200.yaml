# DeepSeek-V3.2 prefill on GB200, smaller EP32 cluster (4 nodes x 8 GPUs).

gpu: GB200
model: deepseek-v3.2

model_overrides:
  dsa_topk: 2048

parallel:
  tp: 4
  ep: 32
  pp: 1
  dp: 1

workload:
  phase: prefill
  batch_size: 8
  context_length: 32768
  # new_tokens defaults to context_length for prefill.
  dtype_param: fp8
  dtype_kv: mixed_bf16_fp8
